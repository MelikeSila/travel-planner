<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteLog — Trip Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f3ee;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd5;--border2:#ccc8be;--text:#1a1916;--text2:#6b6760;--text3:#9e9a93;--accent:#2563eb;--accent-light:#eff4ff;--green:#16a34a;--green-light:#f0fdf4;--amber:#d97706;--amber-light:#fffbeb;--red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;--purple-light:#f5f3ff;--teal:#0d9488;--teal-light:#f0fdfa;--radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 25px rgba(0,0,0,.1),0 4px 10px rgba(0,0,0,.05)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
.header-left{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--text);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.logo-text{font-size:16px;font-weight:600;letter-spacing:-.02em}
.logo-sub{font-size:12px;color:var(--text3);font-weight:400}
.header-right{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{background:#333;border-color:#333}
.btn-danger{background:var(--red-light);color:var(--red);border-color:#fca5a5}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface2);border-color:var(--border)}
.layout{display:grid;grid-template-columns:420px 1fr;flex:1;min-height:0;height:1px}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px}
.stab{padding:12px 14px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.stab.active{color:var(--text);border-bottom-color:var(--text)}
.sidebar-body{flex:1;overflow-y:auto;padding:16px}
.sidebar-section{display:none}
.sidebar-section.active{display:flex;flex-direction:column;gap:10px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:500;color:var(--text2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=number],select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;width:100%;transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:56px}
.transport-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.transport-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:10px;color:var(--text2);transition:all .12s;font-family:'DM Sans',sans-serif}
.transport-btn span.icon{font-size:18px}
.transport-btn:hover{background:var(--surface2)}
.transport-btn.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:500}
.divider{height:1px;background:var(--border);margin:4px 0}
.section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.currency-row{display:flex;gap:6px}
.currency-row select{width:80px;flex-shrink:0}
.currency-row input{flex:1}
.trip-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--surface);transition:all .15s;cursor:grab}
.trip-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.trip-card.dragging{opacity:.4}
.trip-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.trip-card.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.tc-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tc-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tc-icon{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.map-toggle{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
.tc-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tc-meta{font-size:11px;color:var(--text3);margin-top:1px}
.tc-total{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.02em;text-align:right;flex-shrink:0}
.tc-actions{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.segment-item{display:flex;gap:8px;align-items:flex-start;position:relative}
.segment-item:not(:last-child)::before{content:'';position:absolute;left:17px;top:32px;bottom:-8px;width:2px;background:var(--border);z-index:1}
.si-order{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text2);flex-shrink:0;position:relative;z-index:2}
.segment-item:first-child .si-order{border-color:var(--green);color:var(--green);background:var(--green-light)}
.si-body{flex:1;min-width:0}
.route-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface);transition:all .15s}
.route-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.rc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rc-title{display:flex;align-items:center;gap:7px}
.transport-badge{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.rc-cities{font-size:14px;font-weight:600;letter-spacing:-.01em}
.rc-provider{font-size:11px;color:var(--text3);margin-top:1px}
.rc-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.rc-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--text2)}
.rc-price{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.02em}
.rc-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.rc-note{font-size:11px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);line-height:1.5}
.si-actions{display:flex;gap:3px;margin-top:6px}
.segment-form-wrap{border:1px dashed var(--border2);border-radius:var(--radius);padding:14px;background:var(--surface2)}
.stay-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface);transition:all .15s}
.stay-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.stay-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.stay-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.stay-city{font-size:11px;color:var(--text3);margin-top:1px}
.stay-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.stay-actions{display:flex;gap:4px;margin-top:8px}
.total-bar{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between}
.total-label{font-size:12px;color:var(--text2);font-weight:500}
.total-amount{font-size:22px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.03em;color:var(--text)}
.total-count{font-size:11px;color:var(--text3);margin-top:1px}
.total-breakdown{font-size:10px;color:var(--text3);margin-top:2px}
.filter-bar{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.filter-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .12s;font-family:'DM Sans',sans-serif}
.filter-chip:hover{background:var(--surface2)}
.filter-chip.active{background:var(--text);color:#fff;border-color:var(--text)}
#map{height:100%;min-height:500px;z-index:1}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:480px;max-width:95vw;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--border);background:0 0;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .12s}
.modal-close:hover{background:var(--surface2)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px 20px;color:var(--text3);text-align:center}
.empty-state span{font-size:36px}
.empty-state p{font-size:13px;line-height:1.6}
#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.back-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.back-btn{font-size:18px;cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);border:none;background:0 0;color:var(--text2);transition:all .12s}
.back-btn:hover{background:var(--surface2);color:var(--text)}
.inline-title{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.stay-section{margin-top:4px}
.stay-section .section-title{margin-top:8px}
</style>
</head>
<body>
<header>
<div class="header-left">
<div class="logo-icon">✈</div>
<div>
<div class="logo-text">RouteLog</div>
<div class="logo-sub" id="appSubtitle">Seyahat Rota Planlayıcı</div>
</div>
</div>
<div class="header-right">
<div id="userArea" style="display:none;align-items:center;gap:6px">
<img id="userAvatar" style="width:26px;height:26px;border-radius:50%">
<span id="userName" style="font-size:12px;color:var(--text2)"></span>
<button class="btn btn-sm btn-ghost" onclick="logout()" style="font-size:11px" id="logoutBtn">Çıkış</button>
</div>
<button class="btn btn-sm" id="loginBtn" onclick="login()">🚪 <span id="loginBtnLabel">Giriş</span></button>
<button class="btn btn-sm" id="exportBtn" onclick="exportData()">⬇ <span id="exportBtnLabel">Dışa Aktar</span></button>
<button class="btn btn-sm" id="importBtn" onclick="document.getElementById('importFile').click()">⬆ <span id="importBtnLabel">İçe Aktar</span></button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
<button class="btn btn-sm btn-danger" id="deleteAllBtn" onclick="confirmClearAll()">🗑 <span id="deleteAllBtnLabel">Tümünü Sil</span></button>
</div>
</header>
<div class="layout">
<div class="sidebar">
<div class="sidebar-tabs">
<div class="stab active" onclick="switchTab('trips')">🗺 <span id="stabTrips">Seyahatler</span></div>
<div class="stab" onclick="switchTab('settings')"><span id="stabSettings">Ayarlar</span></div>
</div>
<div class="sidebar-body">
<div class="sidebar-section active" id="sec-trips">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:4px">
<div class="section-title" style="margin-bottom:0" id="myTripsTitle">Seyahatlerim</div>
<button class="btn btn-sm btn-primary" onclick="createNewTrip()"><span id="newTripBtn">+ Yeni Seyahat</span></button>
</div>
<div id="tripsList"></div>
</div>
<div class="sidebar-section" id="sec-trip-detail">
<div id="tripDetailHeader"></div>
<div id="segmentList"></div>
<div id="addSegmentSection"></div>
<div id="stayList"></div>
<div id="addStaySection"></div>
<div id="attrList"></div>
<div id="addAttrSection"></div>
</div>
<div class="sidebar-section" id="sec-settings">
<div id="settingsContent"></div>
</div>
</div>
<div class="total-bar">
<div>
<div class="total-label" id="totalLabel">Toplam</div>
<div class="total-count" id="totalCount">0</div>
<div class="total-breakdown" id="totalBreakdown"></div>
</div>
<div class="total-amount" id="totalAmount">—</div>
</div>
</div>
<div id="map"></div>
</div>
<div class="modal-backdrop" id="newTripModal">
<div class="modal" style="max-width:380px">
<div class="modal-header"><div class="modal-title"><span id="newTripModalTitle">Yeni Seyahat</span></div><button class="modal-close" onclick="cm('newTripModal')">✕</button></div>
<div class="form-group">
<label class="form-label" id="newTripLabel">Seyahat Adı</label>
<input type="text" id="newTripTitle" onkeydown="if(event.key==='Enter')confirmNewTrip()">
</div>
<div class="modal-footer">
<button class="btn" onclick="cm('newTripModal')"><span id="newTripCancel">İptal</span></button>
<button class="btn btn-primary" onclick="confirmNewTrip()"><span id="newTripCreate">Oluştur</span></button>
</div>
</div>
</div>
<div class="modal-backdrop" id="editTripModal">
<div class="modal" style="max-width:380px">
<div class="modal-header"><div class="modal-title"><span id="editTripModalTitle">Seyahat Adını Düzenle</span></div><button class="modal-close" onclick="cm('editTripModal')">✕</button></div>
<div class="form-group">
<label class="form-label" id="editTripLabel">Seyahat Adı</label>
<input type="text" id="editTripTitleInput" onkeydown="if(event.key==='Enter')confirmEditTrip()">
</div>
<div class="modal-footer">
<button class="btn" onclick="cm('editTripModal')"><span id="editTripCancel">İptal</span></button>
<button class="btn btn-primary" onclick="confirmEditTrip()"><span id="editTripSave">Kaydet</span></button>
</div>
</div>
</div>
<div class="modal-backdrop" id="editSegModal">
<div class="modal">
<div class="modal-header"><div class="modal-title"><span id="editSegModalTitle">Segmenti Düzenle</span></div><button class="modal-close" onclick="cm('editSegModal')">✕</button></div>
<div id="editSegFormBody"></div>
<div class="modal-footer">
<button class="btn" onclick="cm('editSegModal')"><span id="editSegCancel">İptal</span></button>
<button class="btn btn-primary" onclick="confirmEditSeg()"><span id="editSegSave">Kaydet</span></button>
</div>
</div>
</div>
<div class="modal-backdrop" id="editStayModal">
<div class="modal">
<div class="modal-header"><div class="modal-title"><span id="editStayModalTitle">Konaklamayı Düzenle</span></div><button class="modal-close" onclick="cm('editStayModal')">✕</button></div>
<div id="editStayFormBody"></div>
<div class="modal-footer">
<button class="btn" onclick="cm('editStayModal')"><span id="editStayCancel">İptal</span></button>
<button class="btn btn-primary" onclick="confirmEditStay()"><span id="editStaySave">Kaydet</span></button>
</div>
</div>
</div>
<div class="modal-backdrop" id="editAttrModal">
<div class="modal">
<div class="modal-header"><div class="modal-title"><span id="editAttrModalTitle">Mekanı Düzenle</span></div><button class="modal-close" onclick="cm('editAttrModal')">✕</button></div>
<div id="editAttrFormBody"></div>
<div class="modal-footer">
<button class="btn" onclick="cm('editAttrModal')"><span id="editAttrCancel">İptal</span></button>
<button class="btn btn-primary" onclick="confirmEditAttr()"><span id="editAttrSave">Kaydet</span></button>
</div>
</div>
</div>
<div class="modal-backdrop" id="deleteModal">
<div class="modal" style="max-width:360px">
<div class="modal-header"><div class="modal-title" id="deleteModalTitle"></div><button class="modal-close" onclick="cm('deleteModal')">✕</button></div>
<p style="font-size:13px;color:var(--text2);line-height:1.6" id="deleteModalMsg"></p>
<div class="modal-footer">
<button class="btn" onclick="cm('deleteModal')"><span id="deleteCancel">İptal</span></button>
<button class="btn btn-danger" id="deleteConfirmBtn"><span id="deleteConfirmLabel">Sil</span></button>
</div>
</div>
</div>
<div id="toast"></div>
<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let trips = [];let clipboard = null;let dragIdx = null;let labelMode = 'hover';
let settings = { defaultCurrency: '€', mapStyle: 'light', lang: 'tr' };
let activeTripId = null;
let editingTripId = null;
let editingSegKey = null;
let firebaseUser = null;
let firestoreDB = null;
let editingStayId = null;
let editingAttrId = null;
let addSegTransport = null;
let attrCategory = null;
let map, tileLayer, mapLayers = {};

const T = {
  ucak:{icon:'✈',label:'Uçuş',color:'#2563eb',bg:'#eff4ff'},
  tren:{icon:'🚂',label:'Tren',color:'#0d9488',bg:'#f0fdfa'},
  otobus:{icon:'🚌',label:'Otobüs',color:'#d97706',bg:'#fffbeb'},
  araba:{icon:'🚗',label:'Araba',color:'#16a34a',bg:'#f0fdf4'},
  taksi:{icon:'🚕',label:'Taksi',color:'#ca8a04',bg:'#fefce8'},
  feribot:{icon:'⛴',label:'Feribot',color:'#0284c7',bg:'#f0f9ff'},
  metro:{icon:'🚇',label:'Metro',color:'#7c3aed',bg:'#f5f3ff'},
  tramvay:{icon:'🚋',label:'Tramvay',color:'#db2777',bg:'#fdf2f8'},
  yaya:{icon:'🚶',label:'Yaya',color:'#65a30d',bg:'#f7fee7'},
  bisiklet:{icon:'🚲',label:'Bisiklet',color:'#16a34a',bg:'#f0fdf4'},
  scooter:{icon:'🛴',label:'Scooter',color:'#ea580c',bg:'#fff7ed'},
  diger:{icon:'🚀',label:'Diğer',color:'#6b7280',bg:'#f9fafb'},
};

const A = {
  gezilecek:{icon:'📍',label:'Gezilecek',color:'#2563eb',bg:'#eff4ff'},
  yemek:{icon:'🍽️',label:'Yemek',color:'#d97706',bg:'#fffbeb'},
  gorulecek:{icon:'🏛️',label:'Görülecek',color:'#7c3aed',bg:'#f5f3ff'},
};

const LANG = {
  tr: {
    appTitle:'RouteLog',appSubtitle:'Seyahat Rota Planlayıcı',newTrip:'Yeni Seyahat',myTrips:'Seyahatlerim',
    settings:'Ayarlar',login:'🚪 Giriş',logout:'Çıkış',exportBtn:'Dışa Aktar',importBtn:'İçe Aktar',deleteAll:'Tümünü Sil',
    totalLabel:'Toplam',totalAllTrips:'Tüm Seyahatler Toplamı',totalVisible:'Görünür Seyahatler Toplamı',
    tripTitle:'Seyahat Adı',create:'Oluştur',cancel:'İptal',save:'Kaydet',delete:'Sil',
    editTripName:'Adı Düzenle',duplicate:'Kopyala',
    transport:'Ulaşım',accommodation:'Konaklama',activities:'Aktiviteler',
    addTransport:'+ Ulaşım Ekle',addAccommodation:'+ Konaklama Ekle',addActivity:'+ Mekan Ekle',
    editSegment:'Segmenti Düzenle',editStay:'Konaklamayı Düzenle',editAttr:'Mekanı Düzenle',
    departure:'Kalkış',arrival:'Varış',provider:'Sağlayıcı',price:'Fiyat',date:'Tarih',
    duration:'Süre',passengers:'Kişi Sayısı',note:'Not',
    hotelName:'Otel / Konaklama Adı',city:'Şehir',checkIn:'Giriş Tarihi',checkOut:'Çıkış Tarihi',
    night:'gece',nights:'Gece Sayısı',totalPrice:'Toplam Fiyat',nightlyRate:'gecelik',

const _t = (k, p) => {
  const s = (LANG[settings.lang]||LANG.en)[k]||k;
  if(!p) return s;
  return Object.entries(p).reduce((r,[key,v])=>r.replace(new RegExp('\\{'+key+'\\}','g'),v), s);
};

const TILES = {
  light:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  streets:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function esc(s){if(!s)return '';return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39'})[c]||c)}
function fd(iso){try{return new Date(iso).toLocaleDateString(_l(),{day:'numeric',month:'short',year:'numeric'})}catch{return iso}}
const _l=_=>({'tr':'tr-TR','en':'en-US','de':'de-DE'}[settings.lang]||'tr-TR');
function cm(id){document.getElementById(id).classList.remove('open')}
let _tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('show'),2500)}
const p=v=>parseFloat((v||'').replace(',','.'))||0
function segCost(s){return p(s.price)*(s.passengers||1)}
function stayCost(s){return p(s.price)}
function allSegs(t){const r=[];(t.segments||[]).forEach(s=>r.push(s));(t.stays||[]).forEach(s=>r.push({...s,type:'stay'}));return r}

firebase.initializeApp(FIREBASE_CONFIG);
const fireAuth = firebase.auth();
firestoreDB = firebase.firestore();

function login(){
  fireAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>toast(_t('loginToast'))).catch(e=>console.error(e));
}
function logout(){
  document.getElementById('loginBtn').style.display='none';
  syncToFirestore().then(()=>fireAuth.signOut()).then(()=>toast(_t('logoutToast')));
}
function onFirebaseAuth(user){
  firebaseUser=user;
  const loginBtn=document.getElementById('loginBtn');
  const userArea=document.getElementById('userArea');
  if(user){
    loginBtn.style.display='none';
    userArea.style.display='flex';
    document.getElementById('userAvatar').src=user.photoURL||'';
    document.getElementById('userName').textContent=user.displayName||user.email;
    loadFromFirestore();
  }else{
    loginBtn.style.display='';
    userArea.style.display='none';
  }
}
async function loadFromFirestore(){
  if(!firebaseUser)return;
  try{
    const d=await firestoreDB.collection('users').doc(firebaseUser.uid).get();
    if(d.exists){
      const data=d.data();
      if(data.trips&&data.trips.length){
        trips=data.trips;
        trips.forEach(t=>{if(!t.stays)t.stays=[];if(!t.segments)t.segments=[];if(!t.attractions)t.attractions=[];if(t.visible===undefined)t.visible=true});
        saveTrips();renderTrips();if(activeTripId)renderTripDetail();drawMap();
      }
    }else if(trips.length){
      syncToFirestore();
    }
  }catch(e){console.error('Firestore load error',e)}
}
async function syncToFirestore(){
  if(!firebaseUser)return;
  try{
    await firestoreDB.collection('users').doc(firebaseUser.uid).set({trips,settings});
  }catch(e){console.error('Firestore sync error',e)}
}

fireAuth.onAuthStateChanged(onFirebaseAuth);

// ─── INDEXED DB ─────────────────────────────────────────────────────────────
let db = null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('RouteLogDB',1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
function dbGet(k){return new Promise((res,rej)=>{const t=db.transaction('kv','readonly'),r=t.objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbPut(k,v){return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite'),r=t.objectStore('kv').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbDel(k){return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite'),r=t.objectStore('kv').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function loadData(){
  const t=await dbGet('trips');const s=await dbGet('settings');
  if(t&&t.length){trips=t;trips.forEach(t=>{if(!t.stays)t.stays=[];if(!t.segments)t.segments=[];if(!t.attractions)t.attractions=[];if(t.visible===undefined)t.visible=true})}
  else{const lt=localStorage.getItem('routelog_trips');if(lt){trips=JSON.parse(lt);trips.forEach(t=>{if(!t.stays)t.stays=[];if(!t.segments)t.segments=[];if(!t.attractions)t.attractions=[];if(t.visible===undefined)t.visible=true});dbPut('trips',trips)}}
  if(s)settings={...settings,...s}
  else{const ls=localStorage.getItem('routelog_settings');if(ls){settings={...settings,...JSON.parse(ls)};dbPut('settings',settings)}}
}
function saveTrips(){localStorage.setItem('routelog_trips',JSON.stringify(trips));dbPut('trips',trips);if(firebaseUser)syncToFirestore()}
function saveSettings(){settings.defaultCurrency=document.getElementById('defaultCurrency').value;settings.lang=document.getElementById('langSelect').value;localStorage.setItem('routelog_settings',JSON.stringify(settings));dbPut('settings',settings);if(firebaseUser)syncToFirestore();toast(_t('settingsSaved'))}
function migrateLegacyData(){const r=localStorage.getItem('routelog_routes');if(!r)return false;try{const routes=JSON.parse(r);if(!routes||!routes.length)return false;trips.push({id:'trip_'+Date.now(),title:'Seyahat #1',createdAt:new Date().toISOString(),visible:true,segments:routes.map((x,i)=>({...x,order:i,id:x.id||'seg_'+Date.now()+'_'+i,passengers:x.passengers||1})),stays:[],attractions:[]});saveTrips();localStorage.removeItem('routelog_routes');return true}catch{return false}}

async function retrySegGeocode(tripId,segId){
  const trip=trips.find(t=>t.id===tripId);if(!trip)return;const seg=(trip.segments||[]).find(s=>s.id===segId);if(!seg)return;
  toast(_t('searchingCoords'));const[f,t]=await Promise.all([geocode(seg.from),geocode(seg.to)]);
  if(f&&t){seg.fromLL=f;seg.toLL=t;saveTrips();renderTripDetail();drawMap();toast(_t('coordsUpdated'))}else{toast(_t('coordsNotFound'))}
}
async function retryStayGeocode(tripId,stayId){
  const trip=trips.find(t=>t.id===tripId);if(!trip)return;const stay=(trip.stays||[]).find(s=>s.id===stayId);if(!stay)return;
  toast(_t('searchingCoords'));const ll=await geocode(stay.city);
  if(ll){stay.cityLat=ll;saveTrips();renderTripDetail();drawMap();toast(_t('coordsUpdated'))}else{toast(_t('coordsNotFound'))}
}

function initMap(){
  map=L.map('map',{zoomControl:true}).setView([48,14],4);
  tileLayer=L.tileLayer(TILES[settings.mapStyle],{attribution:'© OpenStreetMap / CartoDB',maxZoom:19}).addTo(map);
  map.on('zoomend',()=>{if(labelMode==='zoom')updateLabelVisibility()});
  const ctrl=L.control({position:'bottomleft'});
  ctrl.onAdd=()=>{
    const d=document.createElement('div');d.style.cssText='background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:6px 10px;font-size:12px;font-family:"DM Sans",sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none';
    d.innerHTML='🏷️ <span id="labelModeText">'+_t('labelModeHover')+'</span>';d.title=_t('labelToggleTitle');
    d.onclick=()=>{labelMode=labelMode==='hover'?'zoom':'hover';document.getElementById('labelModeText').textContent=labelMode==='zoom'?_t('labelModeZoom'):_t('labelModeHover');drawMap();toast(labelMode==='zoom'?_t('labelToastZoom'):_t('labelToastHover'))};
    return d
  };ctrl.addTo(map);
}
function changeMapStyle(){settings.mapStyle=document.getElementById('mapStyleSelect').value;saveSettings();if(tileLayer)map.removeLayer(tileLayer);tileLayer=L.tileLayer(TILES[settings.mapStyle],{attribution:'© OpenStreetMap / CartoDB',maxZoom:19}).addTo(map)}
async function geocode(city){let c=await dbGet('geocache');if(!c)c={};if(c[city])return c[city];try{const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city)+'&format=json&limit=1');const d=await r.json();if(d&&d[0]){const ll=[parseFloat(d[0].lat),parseFloat(d[0].lon)];c[city]=ll;dbPut('geocache',c);return ll}}catch{}return null}
function drawMap(){
  try{map.invalidateSize()}catch{}
  Object.values(mapLayers).forEach(l=>{try{map.removeLayer(l)}catch{}});mapLayers={};const cm={};
  const all=[];
  trips.filter(t=>t.visible!==false).forEach(t=>{
    (t.segments||[]).forEach(s=>all.push({...s,tripId:t.id}));
    (t.stays||[]).forEach(s=>{if(s.city&&s.cityLat)all.push({from:s.city,to:s.city,fromLL:s.cityLat,toLL:s.cityLat,tripId:t.id,id:s.id,type:'stay',icon:'🏨'})});
    (t.attractions||[]).forEach(a=>{if(a.city&&a.lat)all.push({from:a.city,to:a.city,fromLL:a.lat,toLL:a.lat,tripId:t.id,id:a.id,type:'attr',icon:(A[a.category]||{}).icon||'📍',color:(A[a.category]||{}).color||'#6b7280',name:a.name})});
  });

      const m=L.circleMarker(s.fromLL,{radius:7,fillColor:'#7c3aed',color:'white',weight:2,fillOpacity:.9}).addTo(map);

      mapLayers['stay_'+s.tripId+'_'+s.id]=m;return;
    }
    if(s.type==='attr'){
      const ll=cm[s.city]?cm[s.city].getLatLng():s.fromLL;
      if(!cm[s.city]){const c=L.circleMarker(ll,{radius:7,fillColor:'#6b7280',color:'white',weight:2,fillOpacity:.5}).addTo(map);c.bindTooltip('<b style="font-family:\'DM Sans\',sans-serif;font-size:12px;">'+esc(s.city)+'</b>',{permanent:labelMode!=='hover',direction:'top',offset:[0,-8],className:'city-tooltip'});cm[s.city]=c;mapLayers['city_'+s.city]=c}
      const m=L.circleMarker(ll,{radius:6,fillColor:s.color||'#6b7280',color:'white',weight:2,fillOpacity:.9}).addTo(map);
      m.bindTooltip('<b style="font-family:\'DM Sans\',sans-serif;font-size:12px;">'+(s.icon||'📍')+' '+esc(s.name||s.city)+'</b>',{permanent:false,direction:'top',offset:[0,-8],className:'city-tooltip'});
      mapLayers['attr_'+s.tripId+'_'+s.id]=m;return;
    }
    const line=L.polyline([s.fromLL,s.toLL],{color:meta.color,weight:isActive?4:2,opacity:isActive?1:.3,dashArray:['ucak','feribot'].includes(s.type)?null:'7 5'}).addTo(map);
    line.bindPopup('<div style="font-family:\'DM Sans\',sans-serif;font-size:13px;min-width:160px"><b style="font-size:14px;">'+esc(s.from)+' → '+esc(s.to)+'</b><br><span style="color:#6b7280">'+meta.icon+' '+_t('tp_'+s.type)+(s.provider?' · '+esc(s.provider):'')+'</span><br>'+(s.price?'<b style="font-size:15px;color:'+meta.color+'">'+(s.currency||'€')+segCost(s)+'</b>':'')+(s.duration?' · '+s.duration:'')+(s.date?'<br><span style="color:#9ca3af;font-size:11px">'+s.date+'</span>':'')+(s.passengers>1?'<br><span style="color:#9ca3af;font-size:11px">👥 '+_t('person',{n:s.passengers})+' · '+(s.currency||'€')+p(s.price).toLocaleString(_l())+_t('perPerson')+'</span>':'')+(s.note?'<br><span style="color:#9ca3af;font-size:11px;margin-top:4px;display:block">'+esc(s.note)+'</span>':'')+'</div>');
    mapLayers['line_'+s.tripId+'_'+s.id]=line;
    [{city:s.from,ll:s.fromLL},{city:s.to,ll:s.toLL}].forEach(({city,ll})=>{
      if(!cm[city]){const m=L.circleMarker(ll,{radius:7,fillColor:meta.color,color:'white',weight:2,fillOpacity:.9}).addTo(map);m.bindTooltip('<b style="font-family:\'DM Sans\',sans-serif;font-size:12px;">'+esc(city)+'</b>',{permanent:labelMode!=='hover',direction:'top',offset:[0,-8],className:'city-tooltip'});cm[city]=m;mapLayers['city_'+city]=m}
    });
  });
  trips.filter(t=>t.visible!==false).forEach(t=>{
    const route=(t.attractions||[]).filter(a=>cm[a.city]).sort((a,b)=>((a.time||'99:99').localeCompare(b.time||'99:99')));
    if(route.length<2)return;
    const points=route.map(a=>cm[a.city].getLatLng());
    const line=L.polyline(points,{color:'#7c3aed',weight:2,opacity:.5,dashArray:'5 8'}).addTo(map);
    mapLayers['attr_route_'+t.id]=line;
  });
  if(labelMode==='zoom')updateLabelVisibility();
}

function updateLabelVisibility(){
  const z=map.getZoom();const show=z>=8;
  Object.values(mapLayers).forEach(m=>{try{const t=m.getTooltip();if(t){t._container.style.display=show?'':'none'}}catch{}});
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function switchTab(t){
  document.querySelectorAll('.stab').forEach((e,i)=>e.classList.toggle('active',['trips','settings'][i]===t));

}
function openTripDetail(id){

  document.querySelectorAll('.sidebar-section').forEach(e=>e.classList.remove('active'));

}
function goToTrips(){

// ─── RENDER TRIPS ────────────────────────────────────────────────────────────
function renderTrips(){
  const el=document.getElementById('tripsList');
  if(!trips.length){el.innerHTML='<div class="empty-state"><span>🗺️</span><p>'+_t('noTrips').replace('\\n','<br>')+'</p></div>';document.getElementById('totalAmount').textContent='—';document.getElementById('totalCount').textContent='0';document.getElementById('totalBreakdown').textContent='';document.getElementById('totalLabel').textContent=_t('totalLabel');return}
  el.innerHTML=trips.map((t,i)=>{
    const segs=t.segments||[];const stays=t.stays||[];
    const currs=[...new Set([...segs,...stays].filter(x=>x.price).map(x=>x.currency||'€'))];
    const totalStr=currs.map(c=>{const segV=segs.filter(x=>x.price&&(x.currency||'€')===c).reduce((s,x)=>s+p(x.price)*(x.passengers||1),0);const stayV=stays.filter(x=>x.price&&(x.currency||'€')===c).reduce((s,x)=>s+p(x.price),0);return c+(segV+stayV).toLocaleString(_l(),{minimumFractionDigits:0,maximumFractionDigits:2})}).join(' + ');
    const segIcons=[...new Set(segs.map(x=>x.type))].map(tp=>(T[tp]||{}).icon||'🚀');
    const attrIcons=[...new Set((t.attractions||[]).map(x=>x.category))].map(c=>(A[c]||{}).icon||'📍');
    const icons=[...segIcons,...attrIcons].join(' ');
    const pax=[...new Set(segs.map(s=>s.passengers||1))];const paxS=[...new Set(stays.map(s=>s.passengers||1))];
    const paxAll=[...new Set([...segs,...stays].map(s=>s.passengers||1))];
    const paxLabel=!segs.length&&!stays.length?'':'👥 '+_t('person',{n:paxAll[0]})+(paxAll.length>1?' · '+_t('mixed'):'');
    const attrCount=(t.attractions||[]).length;
    const metaParts=[_t('segmentCount',{n:segs.length}),stays.length?_t('stayCount',{n:stays.length}):'',attrCount?_t('attrCount',{n:attrCount}):'',paxLabel,t.createdAt?fd(t.createdAt):''].filter(Boolean);
    return '<div class="trip-card" draggable="true" ondragstart="event.stopPropagation();dragIdx='+i+';this.classList.add(\'dragging\')" ondragover="event.preventDefault();this.classList.add(\'drag-over\')" ondragleave="this.classList.remove(\'drag-over\')" ondrop="event.preventDefault();event.stopPropagation();if(dragIdx!==null&&dragIdx!=='+i+'){const t=trips.splice(dragIdx,1)[0];trips.splice('+i+',0,t);dragIdx=null;saveTrips();renderTrips();drawMap()}" ondragend="this.classList.remove(\'dragging\');document.querySelectorAll(\'.trip-card\').forEach(c=>c.classList.remove(\'drag-over\'))" onclick="openTripDetail(\''+t.id+'\')"><div class="tc-header"><div class="tc-left"><input type="checkbox" class="map-toggle" '+(t.visible!==false?'checked':'')+' onclick="event.stopPropagation();toggleTripVisibility(\''+t.id+'\')"><div class="tc-icon">'+(icons||'🗺')+'</div><div style="min-width:0"><div class="tc-name">'+esc(t.title)+'</div><div class="tc-meta">'+metaParts.join(' · ')+'</div></div></div><div class="tc-total">'+(totalStr||'—')+'</div></div><div class="tc-actions"><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();editTripTitle(\''+t.id+'\')">✏ '+_t('editTripName')+'</button><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();duplicateTrip(\''+t.id+'\')">📋 '+_t('duplicate')+'</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();confirmDeleteTrip(\''+t.id+'\')">🗑</button></div></div>'
  }).join('');
  updateOverallTotal();

function updateOverallTotal(){
  const visible=trips.filter(t=>t.visible!==false);
  const segAll=[];const stayAll=[];visible.forEach(t=>{segAll.push(...(t.segments||[]));stayAll.push(...(t.stays||[]))});
  const bc={};segAll.filter(x=>x.price).forEach(x=>{const c=x.currency||'€';bc[c]=(bc[c]||0)+p(x.price)*(x.passengers||1)});
  stayAll.filter(x=>x.price).forEach(x=>{const c=x.currency||'€';bc[c]=(bc[c]||0)+p(x.price)});
  const parts=Object.entries(bc).map(([c,v])=>c+v.toLocaleString(_l(),{minimumFractionDigits:0,maximumFractionDigits:2}));
  const segCount=visible.reduce((s,t)=>s+(t.segments||[]).length,0);
  const stayCount=visible.reduce((s,t)=>s+(t.stays||[]).length,0);
  const attrCount=visible.reduce((s,t)=>s+(t.attractions||[]).length,0);
  const tp=[...segAll,...stayAll].reduce((s,x)=>s+(x.passengers||1),0);
  const parts2=[];if(segCount)parts2.push(_t('segmentCount',{n:segCount}));if(stayCount)parts2.push(_t('stayCount',{n:stayCount}));if(attrCount)parts2.push(_t('attrCount',{n:attrCount}));parts2.push(_t('person',{n:tp}));parts2.push(_t('tripCount',{n:visible.length}));
  document.getElementById('totalAmount').textContent=parts.length?parts.join(' + '):'—';
  document.getElementById('totalCount').textContent=parts2.join(' · ');
  document.getElementById('totalBreakdown').textContent='';
  document.getElementById('totalLabel').textContent=visible.length!==trips.length?_t('totalVisible'):_t('totalAllTrips');
}

iewOnMap')+'</button>':'')+'</div></div></div>'

function updateTotal(trip){
  const segs=trip.segments||[];const stays=trip.stays||[];
  const byCurrency={};segs.filter(x=>x.price).forEach(x=>{const c=x.currency||'€';byCurrency[c]=(byCurrency[c]||0)+p(x.price)*(x.passengers||1)});
  stays.filter(x=>x.price).forEach(x=>{const c=x.currency||'€';byCurrency[c]=(byCurrency[c]||0)+p(x.price)});
  const segByCurrency={};segs.filter(x=>x.price).forEach(x=>{const c=x.currency||'€';segByCurrency[c]=(segByCurrency[c]||0)+p(x.price)*(x.passengers||1)});
  const stayByCurrency={};stays.filter(x=>x.price).forEach(x=>{const c=x.currency||'€';stayByCurrency[c]=(stayByCurrency[c]||0)+p(x.price)});
  const parts=Object.entries(byCurrency).map(([c,v])=>c+v.toLocaleString(_l(),{minimumFractionDigits:0,maximumFractionDigits:2}));
  const attrs=trip.attractions||[];const attrCount=attrs.length;
  const segCount=segs.length;const stayCount=stays.length;
  const tp=[...segs,...stays].reduce((s,x)=>s+(x.passengers||1),0);
  const breakdownParts=[];
  if(segCount)Object.entries(segByCurrency).forEach(([c,v])=>breakdownParts.push('🚗 '+c+v.toLocaleString(_l(),{minimumFractionDigits:0,maximumFractionDigits:2})+_t('transportCost')));
  if(stayCount)Object.entries(stayByCurrency).forEach(([c,v])=>breakdownParts.push('🏨 '+c+v.toLocaleString(_l(),{minimumFractionDigits:0,maximumFractionDigits:2})+_t('stayCost')));
  const countParts=[];if(segCount)countParts.push(_t('segmentCount',{n:segCount}));if(stayCount)countParts.push(_t('stayCount',{n:stayCount}));if(attrCount)countParts.push(_t('attrCount',{n:attrCount}));countParts.push(_t('person',{n:tp}));
  document.getElementById('totalAmount').textContent=parts.length?parts.join(' + '):'—';
  document.getElementById('totalCount').textContent=countParts.join(' · ');
  document.getElementById('totalBreakdown').textContent=breakdownParts.join(' · ');
  document.getElementById('totalLabel').textContent=_t('tripTotal',{name:esc(trip.title)});
}

  const first=(trip.segments||[])[0]||(trip.stays||[])[0];const cur=first.passengers||1;
  const val=prompt(_t('promptPassengers'),cur);if(val===null)return;
  const num=parseInt(val);if(!num||num<1||num>99){toast(_t('validNumber'));return}
  (trip.segments||[]).forEach(s=>s.passengers=num);(trip.stays||[]).forEach(s=>s.passengers=num);
  saveTrips();renderTripDetail();drawMap();toast(_t('allSet',{n:num}))
}

// ─── TRIP CRUD ───────────────────────────────────────────────────────────────
function createNewTrip(){document.getElementById('newTripTitle').value='';document.getElementById('newTripModal').classList.add('open');setTimeout(()=>document.getElementById('newTripTitle').focus(),100)}
function confirmNewTrip(){const t=document.getElementById('newTripTitle').value.trim();if(!t){toast(_t('titleRequired'));return}const trip={id:'trip_'+Date.now(),title:t,visible:true,createdAt:new Date().toISOString(),segments:[],stays:[],attractions:[]};trips.push(trip);saveTrips();cm('newTripModal');openTripDetail(trip.id);toast(_t('tripCreated'))}
function editTripTitle(tripId){const trip=trips.find(t=>t.id===tripId);if(!trip)return;editingTripId=tripId;document.getElementById('editTripTitleInput').value=trip.title;document.getElementById('editTripModal').classList.add('open');setTimeout(()=>document.getElementById('editTripTitleInput').focus(),100)}
function confirmEditTrip(){const t=document.getElementById('editTripTitleInput').value.trim();if(!t){toast(_t('titleRequired'));return}const trip=trips.find(t=>t.id===editingTripId);if(trip){trip.title=t;saveTrips();renderTrips();if(activeTripId)renderTripDetail();toast(_t('tripUpdated'))}cm('editTripModal');editingTripId=null}
function confirmDeleteTrip(tripId){const trip=trips.find(t=>t.id===tripId);document.getElementById('deleteModalTitle').textContent=_t('deleteConfirmTitle');document.getElementById('deleteModalMsg').textContent=_t('deleteConfirmMsg',{t:trip.title});document.getElementById('deleteConfirmBtn').onclick=()=>deleteTrip(tripId);document.getElementById('deleteModal').classList.add('open')}
function deleteTrip(tripId){trips=trips.filter(t=>t.id!==tripId);saveTrips();cm('deleteModal');if(activeTripId===tripId){activeTripId=null;goToTrips()}else renderTrips();drawMap();toast(_t('tripDeleted'))}
function toggleTripVisibility(tripId){const trip=trips.find(t=>t.id===tripId);if(!trip)return;trip.visible=trip.visible===false?true:false;saveTrips();drawMap();updateOverallTotal()}
function duplicateTrip(tripId){const src=trips.find(t=>t.id===tripId);if(!src)return;const trip={id:'trip_'+Date.now(),title:src.title+' ('+_t('duplicate')+')',visible:true,createdAt:new Date().toISOString(),segments:src.segments.map(s=>({...s,id:'seg_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)})),stays:src.stays.map(s=>({...s,id:'stay_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)})),attractions:src.attractions.map(s=>({...s,id:'attr_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}))};trips.push(trip);saveTrips();renderTrips();toast(_t('tripDuplicated'))}

// ─── MAP FLY ─────────────────────────────────────────────────────────────────
function flyTo(tripId,segId){const trip=trips.find(t=>t.id===tripId);if(!trip)return;const seg=(trip.segments||[]).find(s=>s.id===segId);if(!seg||!seg.fromLL||!seg.toLL)return;map.fitBounds(L.latLngBounds([seg.fromLL,seg.toLL]),{padding:[60,60]});const k='line_'+tripId+'_'+segId;if(mapLayers[k])mapLayers[k].openPopup()}

// ─── IMPORT / EXPORT ─────────────────────────────────────────────────────────
function exportData(){const data={trips,settings,exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='routelog-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast(_t('exportDone'))}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.trips){d.trips.forEach(t=>{if(!t.attractions)t.attractions=[]});trips=d.trips;saveTrips();goToTrips();drawMap();toast(_t('importDone',{n:trips.length}))}else if(d.routes){const trip={id:'trip_'+Date.now(),title:_t('importBtn')+' '+_t('tripOpen'),createdAt:new Date().toISOString(),segments:d.routes.map((x,i)=>({...x,order:i,id:x.id||'seg_'+Date.now()+'_'+i,passengers:x.passengers||1})),stays:[],attractions:[]};trips.push(trip);saveTrips();goToTrips();drawMap();toast(_t('importSegs',{n:d.routes.length}))}}catch{toast(_t('importNoFile'))}};r.readAsText(file);e.target.value=''}

// ─── CLEAR ALL ───────────────────────────────────────────────────────────────
function confirmClearAll(){document.getElementById('deleteModalTitle').textContent=_t('clearAllTitle');document.getElementById('deleteModalMsg').textContent=_t('clearAllMsg');document.getElementById('deleteConfirmBtn').onclick=()=>{trips=[];saveTrips();cm('deleteModal');goToTrips();drawMap();toast(_t('clearAllDone'))};document.getElementById('deleteModal').classList.add('open')}

// ─── SETTINGS UI ──────────────────────────────────────────────────────────────
function renderSettings(){
  document.getElementById('settingsContent').innerHTML=
    '<div class="form-group"><div class="section-title">'+_t('mapStyle')+'</div>'+
    '<select id="mapStyleSelect" onchange="changeMapStyle()">'+
    '<option value="light">'+_t('light')+'</option>'+
    '<option value="dark">'+_t('dark')+'</option>'+
    '<option value="streets">'+_t('streets')+'</option>'+
    '<option value="satellite">'+_t('satellite')+'</option>'+
    '</select></div>'+
    '<div class="form-group"><div class="section-title">'+_t('defaultCurrency')+'</div>'+
    '<select id="defaultCurrency" onchange="saveSettings()">'+
    '<option value="€">€ EUR</option><option value="₺">₺ TRY</option><option value="$">$ USD</option><option value="£">£ GBP</option>'+
    '</select></div>'+
    '<div class="form-group"><div class="section-title">'+_t('language')+'</div>'+
    '<select id="langSelect" onchange="changeLang()">'+
    '<option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option>'+
    '</select></div>'+
    '<div class="divider"></div>'+
    '<div class="section-title">'+_t('dataManagement')+'</div>'+
    '<button class="btn" style="width:100%;justify-content:center" onclick="exportData()">⬇ '+_t('exportJson')+'</button>'+
    '<button class="btn" style="width:100%;justify-content:center" onclick="document.getElementById(\'importFile\').click()">⬆ '+_t('importJson')+'</button>'+
    '<button class="btn btn-danger" style="width:100%;justify-content:center" onclick="confirmClearAll()">🗑 '+_t('deleteAll')+'</button>'+
    '<div style="font-size:11px;color:var(--text3);line-height:1.7;padding:8px 0">'+_t('dataInfo').replace('\\n','<br>')+'</div>';
}
function changeLang(){
  settings.lang=document.getElementById('langSelect').value;
  saveSettings();renderSettings();
  document.getElementById('mapStyleSelect').value=settings.mapStyle;
  document.getElementById('langSelect').value=settings.lang;
  document.getElementById('defaultCurrency').value=settings.defaultCurrency;
  translateUI();renderTrips();if(activeTripId)renderTripDetail();drawMap();
}
function translateUI(){
  document.title=_t('appSubtitle');
  const te=(id,k)=>{const e=document.getElementById(id);if(e)e.textContent=_t(k||id)};
  te('appSubtitle');te('exportBtnLabel','exportBtn');te('importBtnLabel','importBtn');
  te('deleteAllBtnLabel','deleteAll');te('loginBtnLabel','login');te('logoutBtn','logout');te('stabTrips','myTrips');te('stabSettings','settings');
  te('myTripsTitle','myTrips');te('newTripBtn','newTrip');
  te('newTripModalTitle','newTrip');te('newTripLabel','tripTitle');
  document.getElementById('newTripTitle').placeholder=_t('newTripPlaceholder');
  te('newTripCancel','cancel');te('newTripCreate','create');
  te('editTripModalTitle','editTripName');te('editTripLabel','tripTitle');
  te('editTripCancel','cancel');te('editTripSave','save');
  te('editSegModalTitle','editSegment');te('editSegCancel','cancel');te('editSegSave','save');
  te('editStayModalTitle','editStay');te('editStayCancel','cancel');te('editStaySave','save');
  te('editAttrModalTitle','editAttr');te('editAttrCancel','cancel');te('editAttrSave','save');
  te('deleteCancel','cancel');te('deleteConfirmLabel','delete');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',async()=>{
  db=await openDB();await loadData();const m=migrateLegacyData();initMap();if(m)toast(_t('migrated'))
  ;renderSettings();document.getElementById('defaultCurrency').value=settings.defaultCurrency;document.getElementById('mapStyleSelect').value=settings.mapStyle;document.getElementById('langSelect').value=settings.lang
  ;translateUI();renderTrips();drawMap()
  ;setTimeout(()=>map.invalidateSize(),200);window.addEventListener('resize',()=>map.invalidateSize())
});
</script>
